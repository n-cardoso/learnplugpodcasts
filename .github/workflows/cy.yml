name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  test:
    runs-on: ubuntu-22.04
    name: PHP 8.2 • mariadb

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Detect source plugin directory
        run: |
          if [ -f "plugin/mod/learnplugpodcasts/version.php" ]; then
            echo "PLUGIN_DIR=plugin/mod/learnplugpodcasts" >> "$GITHUB_ENV"
          elif [ -f "plugin/version.php" ]; then
            echo "PLUGIN_DIR=plugin" >> "$GITHUB_ENV"
          else
            echo "Could not detect source plugin directory." >&2
            ls -la plugin
            exit 1
          fi

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, mbstring, xml, curl, soap, zip, gd, mysqli, pgsql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin "./${PLUGIN_DIR}" --db-host=127.0.0.1
        env:
          DB: mysqli
          MOODLE_BRANCH: MOODLE_405_STABLE
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: moodle

      - name: Detect installed plugin path in Moodle tree
        run: |
          MATCH="$(grep -R -l \"\\$plugin->component = 'mod_learnplugpodcasts'\" ci/moodle/mod/*/version.php | head -n1 || true)"
          if [ -z "$MATCH" ]; then
            echo "Installed plugin path not found in ci/moodle/mod." >&2
            find ci/moodle/mod -maxdepth 2 -type f -name version.php | sort
            exit 1
          fi
          echo "CI_PLUGIN_DIR=$(dirname "$MATCH")" >> "$GITHUB_ENV"
          echo "Detected installed plugin path: $(dirname "$MATCH")"

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin metadata
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache --moodle ./ci/moodle "./${CI_PLUGIN_DIR}"

      - name: Grunt
        id: grunt
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --moodle ./ci/moodle --max-lint-warnings 0 "./${CI_PLUGIN_DIR}"

      - name: Upload AMD build artifacts
        if: ${{ !cancelled() && steps.grunt.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: mod_learnplugpodcasts-amd-build
          path: ${{ env.CI_PLUGIN_DIR }}/amd/build/
          if-no-files-found: ignore

      - name: Sync rebuilt AMD files back to plugin checkout
        if: ${{ !cancelled() && steps.grunt.outcome == 'success' }}
        run: |
          mkdir -p "${PLUGIN_DIR}/amd/build"
          rsync -a "${CI_PLUGIN_DIR}/amd/build/" "${PLUGIN_DIR}/amd/build/"

      - name: Fail if AMD build files changed
        if: ${{ !cancelled() && steps.grunt.outcome == 'success' }}
        run: |
          git -C "${PLUGIN_DIR}" diff --exit-code -- amd/build/
