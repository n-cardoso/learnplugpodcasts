            exit 1
          fi
          echo "MOODLE_DIR=moodle" >> "$GITHUB_ENV"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, mbstring, xml, curl, soap, zip, gd, mysqli, pgsql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin "./${PLUGIN_DIR}" --db-host=127.0.0.1
        env:
          DB: mysqli
          MOODLE_BRANCH: MOODLE_405_STABLE
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: moodle

      - name: Detect installed plugin path in Moodle tree
        run: |
          if [ -d "${MOODLE_DIR}/mod/learnplugpodcasts" ]; then
            echo "CI_PLUGIN_DIR=${MOODLE_DIR}/mod/learnplugpodcasts" >> "$GITHUB_ENV"
            echo "Detected installed plugin path: ${MOODLE_DIR}/mod/learnplugpodcasts"
          elif [ -d "${MOODLE_DIR}/mod/plugin" ]; then
            echo "CI_PLUGIN_DIR=${MOODLE_DIR}/mod/plugin" >> "$GITHUB_ENV"
            echo "Detected installed plugin path: ${MOODLE_DIR}/mod/plugin"
          else
            echo "Installed plugin path not found in ${MOODLE_DIR}/mod." >&2
            find "${MOODLE_DIR}/mod" -maxdepth 2 -type f -name version.php | sort || true
            exit 1
          fi

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin metadata
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache --moodle "./${MOODLE_DIR}" "./${CI_PLUGIN_DIR}"

      - name: Grunt
        id: grunt
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci grunt --moodle "./${MOODLE_DIR}" --max-lint-warnings 0 "./${CI_PLUGIN_DIR}"

      - name: Upload AMD build artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: mod_learnplugpodcasts-amd-build
          path: ${{ env.CI_PLUGIN_DIR }}/amd/build/
          if-no-files-found: error

      - name: Sync rebuilt AMD files back to plugin checkout
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p "${PLUGIN_DIR}/amd/build"
          rsync -a "${CI_PLUGIN_DIR}/amd/build/" "${PLUGIN_DIR}/amd/build/"

      - name: Detect AMD build drift
        id: amd_diff
        if: ${{ always() && !cancelled() }}
        run: |
          REL_PLUGIN_DIR="${PLUGIN_DIR#plugin/}"
          if [ -z "${REL_PLUGIN_DIR}" ] || [ "${REL_PLUGIN_DIR}" = "plugin" ]; then
            BUILD_DIR="amd/build/"
          else
            BUILD_DIR="${REL_PLUGIN_DIR}/amd/build/"
          fi

          if git -C plugin diff --quiet -- "${BUILD_DIR}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No AMD build drift detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "AMD build drift detected."
          fi

      - name: Auto-commit rebuilt AMD files (push/workflow_dispatch)
        if: ${{ always() && !cancelled() && steps.amd_diff.outputs.changed == 'true' && github.event_name != 'pull_request' }}
        run: |
          REL_PLUGIN_DIR="${PLUGIN_DIR#plugin/}"
          if [ -z "${REL_PLUGIN_DIR}" ] || [ "${REL_PLUGIN_DIR}" = "plugin" ]; then
            BUILD_DIR="amd/build/"
          else
            BUILD_DIR="${REL_PLUGIN_DIR}/amd/build/"
          fi

          git -C plugin config user.name "github-actions[bot]"
          git -C plugin config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C plugin add "${BUILD_DIR}"

          if git -C plugin diff --cached --quiet; then
            echo "No staged AMD changes to commit."
            exit 0
          fi

          git -C plugin commit -m "chore: rebuild AMD artifacts for mod_learnplugpodcasts"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git -C plugin push origin "HEAD:${BRANCH}"

      - name: Fail PR when AMD build drift exists
        if: ${{ always() && !cancelled() && steps.amd_diff.outputs.changed == 'true' && github.event_name == 'pull_request' }}
        run: |
          echo "AMD build artifacts are out of sync. Please commit rebuilt amd/build files."
          exit 1

      - name: Final AMD drift guard
        if: ${{ !cancelled() }}
        run: |
          REL_PLUGIN_DIR="${PLUGIN_DIR#plugin/}"
          if [ -z "${REL_PLUGIN_DIR}" ] || [ "${REL_PLUGIN_DIR}" = "plugin" ]; then
            BUILD_DIR="amd/build/"
          else
            BUILD_DIR="${REL_PLUGIN_DIR}/amd/build/"
          fi
          git -C plugin diff --exit-code -- "${BUILD_DIR}"
